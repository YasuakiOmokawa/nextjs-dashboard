include:
  - path: ./node_modules/@taimei-code/auth-client/testing/compose.yml
    env_file: ./e2e/taimei-auth.env

volumes:
  pg-data:

services:
  e2e-postgres:
    image: postgres:16.8-alpine3.21
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DATABASE=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_ROOT_PASSWORD=root
      - PGPORT=5433
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 3s
      timeout: 3s
      retries: 5

  e2e-application:
    build:
      context: '.'
      dockerfile: Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    command: >
      sh -c "bunx drizzle-kit migrate && bun run start"
    user: vscode
    environment:
      - DATABASE_URL=postgres://postgres:password@e2e-postgres:5433/postgres
      - PORT=3001
      - LOCAL_UPSTREAM=app.taimei-code.local:3001
      - AUTH_URL=http://auth.taimei-code.local:3100
      - AUTH_SERVICE_URL=http://auth.taimei-code.local:3100
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: ./package.json
    depends_on:
      e2e-postgres:
        condition: service_healthy
      taimei-auth:
        condition: service_healthy
    networks:
      default:
        aliases:
          - app.taimei-code.local

  e2e:
    build:
      context: './e2e'
      dockerfile: Dockerfile
      additional_contexts:
        - common=./
    environment:
      - CI=${CI:-true}
      - PLAYWRIGHT_BASE_URL=http://app.taimei-code.local:3001
      - APP_BASE_URL=http://app.taimei-code.local:3001
      - AUTH_BASE_URL=http://auth.taimei-code.local:3100
      - APP_DATABASE_URL=postgres://postgres:password@e2e-postgres:5433/postgres
    command: >
      sh -c "${E2E_SERVICE_COMMAND}"
    volumes:
      - ./e2e/playwright-report:/app/playwright-report
      - ./e2e/test-results:/app/test-results
      - ./node_modules/@taimei-code/auth-client:/app/node_modules/@taimei-code/auth-client:ro
    ports:
      - "9323:9323"
    develop:
      watch:
        - action: sync
          path: ./e2e
          target: /app
        - action: rebuild
          path: ./e2e/package.json
    depends_on:
      - e2e-application
      - taimei-auth
