include:
  - path:
      - ./node_modules/@taimei-code/auth-client/testing/compose.yml
      - ./docker-compose.taimei-auth-port.yml
    env_file: ./e2e/taimei-auth.env

volumes:
  pg-data:

services:
  postgres:
    image: postgres:16.8-alpine3.21
    volumes:
      - pg-data:/var/lib/postgresql/data
      - type: bind
        source: "./dump"
        target: "/dump"
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DATABASE=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_ROOT_PASSWORD=root
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 3s
      timeout: 3s
      retries: 5

  test_db:
    image: postgres:16.8-alpine3.21
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=taimei_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: pg_isready -U postgres -d taimei_test
      interval: 3s
      timeout: 3s
      retries: 5

  application:
    build:
      context: '.'
      dockerfile: Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    ports:
      - "3001:3001"
    command: >
      sh -c "bunx drizzle-kit migrate && bun run build && bun run start"
    user: vscode
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/postgres
      - PORT=3001
      - LOCAL_UPSTREAM=app.taimei-code.local:3001
      - AUTH_URL=http://auth.taimei-code.local:3100
      - AUTH_SERVICE_URL=http://auth.taimei-code.local:3100
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: ./package.json
    depends_on:
      postgres:
        condition: service_healthy
      taimei-auth:
        condition: service_healthy
    networks:
      default:
        aliases:
          - app.taimei-code.local
