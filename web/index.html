<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taimei</title>
    <script>
      {
        const page = /^\/dashboard(?:\/(.+))?$/.exec(location.pathname);
        if (page)
          window.taimeiEarlyFetches = new Map(
            ["/api/me", `/api/${page[1] ?? "teams"}`].map((url) => [url, fetch(url)]),
          );
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script>
      // Static Assets は prerender していない path にも / の prerender (index.html) を返すので、JS が描くまで LP を見せない
      {
        const root = document.getElementById("root");
        if (root.dataset.prerenderedPath !== location.pathname)
          root.replaceChildren();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
